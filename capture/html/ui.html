        .killbord {
            width: 20vw;
            height: 15vw;
            float: right;
            background-size: 11vw 100%;
            margin-top: 65vh;
            margin-right: -86vw;
        }
        
        .killbord ul {
            list-style: none;
            margin-left: 3em;
            counter-reset: line;
        }
        
        .killbord ul > li {
            border: 2px groove #ecedb7;
            font-size: 0.8vw;
            background: #08080885;
            height: 1vw; 
            border-radius: 1vw;
            position: relative;
            margin-bottom: 0.5em;
            text-align: left;
            padding-left: 0.5vw;
            /* padding-top: 4px; */
            font-weight: bold;
            color: #fff;
        }

        .killbord ul>li>span {
			position: absolute;
			display: inline-block;
			
			text-align: center;
			right:0.2vw;
			font-weight: bold;
            padding-right: 0.2vw;
			color:rgb(238, 150, 150);
		}

        
        .killbord ul > li:before {
            position: absolute;
            left: -2.5em;
            display: inline-block;
            width: 1vw;
            height: 1vw;
            margin-right: 0.5em;
            background-color: #B53C2C;
            border-radius: 50%;
            color: #fff;
            text-align: center;
            /* padding-top: 1px; */
            line-height: 1vw;
            counter-increment: line;
            content: counter(line);
            font-weight: bold;
        }

        .org-style {
            width: 12vw;
            border-radius: 7vw;
        }

        .top-title {
            width: 7vw;
            margin-left: 9vw;
            padding: 0.2vw;
            border-style: groove;
            font-size: 1vw;
            text-align: center;
            border-radius: 0.5vw;
            background-color: yellow;
            
        }

        #myProgress {
            width: 12vw;
            margin-left: 7vw;
            background-color: #cfbebe77;
            margin-top: 1vw;
            border-radius: 1vw;
            text-align: center;
            background-image: url("assets/imgs/proccess.png");
            background-repeat: no-repeat;
            background-size: 100% 100%;
            transition: 0.5s
        }
        
        .processtime {
            width: 50%;
            height: 3vh;
            background-color: #e8b200;
            transition: width 1s ease 0s;
            border-radius: 1vw;
        }
    </style>
</head>

<html>

<head>
		<script src="nui://game/ui/jquery.js" type="text/javascript"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
		<link href="css/style.css" rel="stylesheet" type="text/css" />
</head>
<body>
	<div class="dialog">
		<form id="register" name="register" action="#">
			<input id="firstname" type="text" class="input-text" name="firstname"
				placeholder="Name" pattern="[a-zA-Z].{3,}" required maxlength="10"><br>
			<input id="lastname" type="text" class="input-text" name="lastname"
				placeholder="Last Name" pattern="[a-zA-Z].{3,}" maxlength="10" required><br>

			<button id="submit" type="submit">
				<font size="5px">Register</font>
			</button>
		</form>
	</div>
	<script src="js/script.js" type="text/javascript"></script>
</body>
</html>
